<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tiny Apocalypse: Scrap Kings</title>
<style>
:root{color-scheme:dark;--lime:#d6ff72;--rust:#f18a50}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101713;color:#f8efd9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}
#shell{height:100dvh;min-height:600px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#354c3e,#101713 72%)}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 5px}
.brand{font-size:clamp(13px,3.5vw,21px);font-weight:1000;letter-spacing:1px;color:var(--lime);text-shadow:0 2px 5px #000}
.stats{text-align:right;font-size:12px;line-height:1.5;font-weight:800}
#stage{position:relative;flex:1;min-height:300px;margin:4px 8px;border:2px solid #82906a;border-radius:14px;overflow:hidden;background:#263d2c;box-shadow:0 10px 34px #000b,inset 0 0 30px #0008}
canvas{display:block;width:100%;height:100%;touch-action:none}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:8px 13px;background:#101a18eF;border:1px solid #d6ff7280;border-radius:10px;font-size:12px;font-weight:900;white-space:nowrap;pointer-events:none;box-shadow:0 4px 15px #0008}
#bottom{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;padding:8px 12px max(12px,env(safe-area-inset-bottom));background:#101a18}
#dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:5px}
.ctrl{border:2px solid #a9b98a;border-radius:13px;background:linear-gradient(155deg,#667b51,#293c30);color:#fff8df;font-size:22px;font-weight:1000;min-width:48px;min-height:44px;box-shadow:0 4px 0 #111c16;touch-action:none}
.ctrl:active,.ctrl.down{transform:translateY(3px);box-shadow:0 1px 0 #111c16;background:#91a95c}
.blank{visibility:hidden}
.actions{display:grid;grid-template-columns:repeat(2,minmax(70px,1fr));gap:7px;max-width:300px;margin-left:auto;width:100%}
.action{font-size:11px;letter-spacing:.3px;min-height:48px;background:linear-gradient(#bb7048,#733d2b);border-color:#eaa16e}
.green{background:linear-gradient(#9bbd56,#4c6c32);border-color:#d6ff72}
.hint{text-align:center;font-size:10px;color:#c0c9ad;padding:0 8px 5px}
@media(min-width:700px){#stage{max-width:1200px;width:calc(100% - 20px);margin:4px auto}#bottom{max-width:1200px;width:100%;margin:auto}#dpad{grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,54px)}.ctrl{font-size:25px}}
</style>
</head>
<body>
<div id="shell">
 <header id="top"><div class="brand">⚙ TINY APOCALYPSE <span style="color:#f18a50">/ SCRAP KINGS</span></div>
 <div class="stats">SCRAP <b id="scrap">0</b>　♥ <b id="hp">100</b><br>BACKYARD • DAY 01</div></header>
 <main id="stage"><canvas id="game"></canvas><div id="toast">SCAVENGE THE YARD • FIND 5 SCRAP</div></main>
 <section id="bottom"><div id="dpad">
  <div class="blank"></div><button class="ctrl" data-dir="up">▲</button><div class="blank"></div>
  <button class="ctrl" data-dir="left">◀</button><button class="ctrl" data-dir="down">▼</button><button class="ctrl" data-dir="right">▶</button>
 </div><div class="actions">
  <button class="ctrl action green" id="attack">⚔ ATTACK</button><button class="ctrl action" id="ram">🚙 RAM</button>
  <button class="ctrl action" id="interact">✋ PICK UP</button><button class="ctrl action" id="car">🚗 ENTER CAR</button>
 </div></section>
 <div class="hint">HOLD ARROWS TO MOVE • PICK UP SCRAP • ATTACK BUGS • EXPLORE THE YARD</div>
</div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d",{alpha:false});
const stage=document.getElementById("stage"),toast=document.getElementById("toast");
let VW=1000,VH=620;
const world={w:3000,h:2200};
let cssW=1,cssH=1,dpr=1,toastLeft=0;
const particles=[],tracks=[];
function resize(){
 const r=stage.getBoundingClientRect();cssW=Math.max(320,r.width);cssH=Math.max(260,r.height);
 dpr=Math.min(window.devicePixelRatio||1,3);
 canvas.width=Math.round(cssW*dpr);canvas.height=Math.round(cssH*dpr);
 canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
 VW=cssW; VH=cssH;
}
new ResizeObserver(resize).observe(stage);window.addEventListener("orientationchange",()=>setTimeout(resize,120));resize();

const player={x:520,y:1030,hp:100,scrap:0,car:false,faceX:1,faceY:0,angle:0,speed:0,attack:0,attackCooldown:0,bob:0,invuln:0};
const keys={up:false,down:false,left:false,right:false};
const camera={x:0,y:0};
const rand=(n)=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const junk=Array.from({length:36},(_,i)=>({x:170+rand(i+4)*2650,y:180+rand(i+87)*1850,kind:i%4,got:false,phase:rand(i+300)*6.28}));
const bugs=[{x:850,y:800,hp:3,phase:0},{x:1600,y:560,hp:3,phase:2},{x:2030,y:1320,hp:3,phase:4}];
const props=[];
for(let i=0;i<170;i++){
 let x=70+rand(i+1000)*2860,y=70+rand(i+2000)*2060;
 if(Math.abs(y-930)>100)props.push({x,y,type:i%5,rot:rand(i+900)*6.28,s:0.6+rand(i+700)*1.2});
}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function say(s){toast.textContent=s;toast.style.opacity=1;toastLeft=2.1;}
function path(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
function drawGround(){
 ctx.fillStyle="#536b43";ctx.fillRect(0,0,world.w,world.h);
 // Fixed world-space grass flecks: never redraw as screen-space terrain.
 for(let i=0;i<1800;i++){let x=rand(i+5000)*world.w,y=rand(i+7000)*world.h;
  ctx.strokeStyle=i%3?"#8da06455":"#273d2d55";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+2,y-4-rand(i)*5);ctx.stroke();}
 // broad worn dirt track and cracked paving
 path([[0,940],[500,925],[980,970],[1500,930],[2050,955],[2600,910]],"#8e8062",178);
 path([[0,940],[500,925],[980,970],[1500,930],[2050,955],[2600,910]],"#a89a76",145);
 for(let i=0;i<100;i++){let x=rand(i+8000)*world.w,y=900+rand(i+9000)*90;
  ctx.fillStyle="#6e6956";ctx.beginPath();ctx.ellipse(x,y,8+rand(i)*15,3+rand(i+1)*6,rand(i+2),0,Math.PI*2);ctx.fill();}
 // top and bottom boundary fence
 for(let y of [35,world.h-45]){rounded(0,y,world.w,24,4,"#303b32");for(let x=0;x<world.w;x+=48){rounded(x,y-7,7,38,2,"#b4a47c");}}
 // big abandoned shed and greenhouse, fixed in world
 rounded(170,150,560,300,22,"#28372f");rounded(182,162,536,276,15,"#9a6746");
 rounded(205,185,490,230,10,"#3c4940");rounded(230,210,190,170,8,"#52675c");
 for(let i=0;i<3;i++){rounded(445+i*78,210,62,170,6,"#718477");ctx.strokeStyle="#34443a";ctx.lineWidth=5;ctx.strokeRect(445+i*78,210,62,170);}
 rounded(850,120,490,360,24,"#34453d");rounded(870,140,450,320,16,"#8c9b7d");
 for(let i=0;i<5;i++){ctx.fillStyle="#536e5a";ctx.fillRect(892+i*84,162,68,270);ctx.strokeStyle="#c2c9a3";ctx.lineWidth=3;ctx.strokeRect(892+i*84,162,68,270);}
 // junk pile and oil drums
 for(let i=0;i<12;i++){let x=1480+(i%4)*66,y=230+Math.floor(i/4)*58;ctx.save();ctx.translate(x,y);ctx.rotate(i*.21);rounded(-28,-18,56,36,7,["#a95e39","#6e7770","#c39a54"][i%3]);rounded(-19,-11,38,22,4,"#344039");ctx.restore();}
 for(let i=0;i<8;i++){let x=2100+(i%4)*75,y=300+Math.floor(i/4)*95;ctx.fillStyle="#b85f3b";ctx.beginPath();ctx.ellipse(x,y,23,28,0,0,7);ctx.fill();path([[x-18,y-9],[x+18,y-9]],"#e5a06b",3);path([[x-18,y+9],[x+18,y+9]],"#713e2e",3);}
 // scattered stones, weeds, tufts
 props.forEach(o=>{ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.scale(o.s,o.s);
  if(o.type<2){ctx.fillStyle="#263a2d";ctx.beginPath();ctx.ellipse(0,4,12,5,0,0,7);ctx.fill();path([[0,4],[-7,-9],[0,-15],[8,-8]],"#a1ad67",3);}
  else if(o.type===2){ctx.fillStyle="#6c6b59";ctx.beginPath();ctx.ellipse(0,0,10,6,0,0,7);ctx.fill();ctx.fillStyle="#9d987b";ctx.beginPath();ctx.ellipse(-3,-2,4,2,0,0,7);ctx.fill();}
  else{rounded(-11,-8,22,16,3,"#7a5940");path([[-7,-3],[7,4]],"#c39a67",2);}
  ctx.restore();});
}
function drawVehicle(x,y,angle=0,scale=1){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);
 ctx.fillStyle="#111a1499";ctx.beginPath();ctx.ellipse(0,10,84,49,0,0,7);ctx.fill();
 // tires and chunky fenders
 for(const yy of [-43,43])for(const xx of [-45,45]){
  rounded(xx-19,yy-12,38,24,7,"#151c18");rounded(xx-12,yy-8,24,16,5,"#566052");
  path([[xx-8,yy-5],[xx+8,yy+5]],"#202820",3);
 }
 rounded(-78,-38,156,76,17,"#60382a");rounded(-70,-34,140,68,14,"#b66b40");
 rounded(-34,-28,73,56,9,"#2d443b");rounded(-27,-22,59,44,6,"#8fa99a");
 rounded(42,-25,22,50,5,"#d4a45e");rounded(-78,-47,35,13,4,"#252c25");
 rounded(40,-47,35,13,4,"#252c25");rounded(-78,34,35,13,4,"#252c25");rounded(40,34,35,13,4,"#252c25");
 rounded(-80,-7,12,14,3,"#c7c5a0");rounded(-80,10,12,14,3,"#c7c5a0");
 rounded(70,-24,12,14,3,"#f6d68c");rounded(70,10,12,14,3,"#f6d68c");
 path([[-77,-30],[78,-30]],"#e5a16a",3);path([[-77,30],[78,30]],"#6c3d2d",3);
 // roof rack and scavenged gear
 rounded(-20,-24,38,48,5,"#34433a");rounded(-13,-18,24,36,4,"#7d9183");
 path([[-53,-20],[-38,-20],[-38,20],[-53,20]],"#d6bd83",4);
 ctx.restore();
}
function burst(x,y,color,count=10){
 for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,v=35+Math.random()*130;
  particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.45,max:.8,color,size:2+Math.random()*4});}
}
function drawParticles(dt){
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;
  if(p.life<=0){particles.splice(i,1);continue;}
  ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 }
}
function drawScrap(t){
 junk.forEach(j=>{if(j.got)return;ctx.save();ctx.translate(j.x,j.y+Math.sin(t/450+j.phase)*3);ctx.rotate(j.phase);
 ctx.fillStyle="#111b1688";ctx.beginPath();ctx.ellipse(0,9,18,6,0,0,7);ctx.fill();
 rounded(-15,-10,30,20,4,["#d9a04f","#aab6ad","#d1c16c","#c56c43"][j.kind]);
 rounded(-8,-5,16,10,2,"#3b4b40");ctx.strokeStyle="#f8d98a";ctx.lineWidth=2;ctx.strokeRect(-13,-8,26,16);ctx.restore();});
}
function drawBug(b,t){
 if(b.hp<=0)return;ctx.save();ctx.translate(b.x,b.y+Math.sin(t/180+b.phase)*5);
 ctx.fillStyle="#17231b99";ctx.beginPath();ctx.ellipse(0,12,29,11,0,0,7);ctx.fill();
 for(let k=-1;k<=1;k++){path([[-8,k*7],[ -25,k*13-5],[-31,k*19]],"#202a20",5);path([[8,k*7],[25,k*13-5],[31,k*19]],"#202a20",5);}
 ctx.fillStyle="#25352b";ctx.beginPath();ctx.ellipse(0,0,25,18,0,0,7);ctx.fill();
 ctx.fillStyle="#6c8b4c";ctx.beginPath();ctx.ellipse(-4,-2,17,12,0,0,7);ctx.fill();
 ctx.fillStyle="#f3ed9a";ctx.beginPath();ctx.arc(-10,-6,4,0,7);ctx.arc(8,-6,4,0,7);ctx.fill();
 ctx.fillStyle="#222";ctx.beginPath();ctx.arc(-10,-6,1.5,0,7);ctx.arc(8,-6,1.5,0,7);ctx.fill();
 ctx.fillStyle="#f0cf75";ctx.fillRect(-12,-27,24,4);ctx.fillStyle="#a84c36";ctx.fillRect(-12,-27,24*b.hp/3,4);ctx.restore();
}
function drawPlayer(t){
 ctx.save();ctx.translate(player.x,player.y+Math.sin(t/110)*1.5);
 ctx.fillStyle="#111b1699";ctx.beginPath();ctx.ellipse(0,15,23,10,0,0,7);ctx.fill();
 if(player.car){drawVehicle(0,0,player.angle,0.92);ctx.restore();return;}
 // backpack, boots, jacket, head, cap, highlights
 rounded(-20,-7,12,20,5,"#76533a");rounded(-13,3,10,10,3,"#242c26");rounded(5,3,10,10,3,"#242c26");
 ctx.fillStyle="#b95e3b";ctx.beginPath();ctx.ellipse(0,1,16,18,0,0,7);ctx.fill();
 ctx.fillStyle="#d7b487";ctx.beginPath();ctx.arc(0,-15,12,0,7);ctx.fill();
 ctx.fillStyle="#314a39";ctx.beginPath();ctx.arc(0,-19,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-13,-19,26,5);
 ctx.fillStyle="#202920";ctx.fillRect(4,-17,3,3);
 ctx.strokeStyle="#f4df9a";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(16,8);ctx.stroke();
 if(player.attack>0){ctx.strokeStyle="#fff08a";ctx.lineWidth=8;ctx.beginPath();ctx.arc(player.faceX*24,player.faceY*24,34,-1.15,1.2);ctx.stroke();}
 ctx.restore();
}
function render(t){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;
 ctx.fillStyle="#263d2c";ctx.fillRect(0,0,VW,VH);
 ctx.save();ctx.translate(-camera.x,-camera.y);
 drawGround();
 // World landmark and parked truck are anchored in world coordinates.
 drawVehicle(550,1110,-.12,.95);
 drawScrap(t);bugs.forEach(b=>drawBug(b,t));drawPlayer(t);
 ctx.font="900 20px system-ui";ctx.fillStyle="#f3e4bd";ctx.fillText("THE OLD SHED",300,135);ctx.fillText("BROKEN GREENHOUSE",960,105);
 drawParticles(0);
 ctx.restore();
 const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.28,VW/2,VH/2,Math.max(VW,VH)*.72);
 g.addColorStop(0,"#0000");g.addColorStop(1,"#08110c66");ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
 rounded(14,14,210,46,12,"#111c18dd");ctx.fillStyle="#d6ff72";ctx.font="900 16px system-ui";ctx.fillText("✦ SCRAP "+player.scrap+" / 5",27,43);
 rounded(VW-154,14,140,46,12,"#111c18dd");ctx.fillStyle="#f5e9ce";ctx.fillText("♥ "+player.hp+"  •  YARD",VW-141,43);
 if(player.car){rounded(VW/2-85,VH-48,170,32,10,"#101a18dd");ctx.fillStyle="#f6d18c";ctx.textAlign="center";ctx.fillText("TRUCK SPEED  "+Math.abs(Math.round(player.speed)),VW/2,VH-27);ctx.textAlign="left";}
}
function update(dt,t){
 let ix=(keys.right?1:0)-(keys.left?1:0),iy=(keys.down?1:0)-(keys.up?1:0);
 if(player.car){
  const throttle=(keys.up?1:0)-(keys.down?1:0);
  const steer=(keys.right?1:0)-(keys.left?1:0);
  player.speed+=(throttle*520*dt);
  player.speed*=Math.pow(.985,dt*60);
  player.speed=Math.max(-190,Math.min(390,player.speed));
  if(Math.abs(player.speed)>5)player.angle+=steer*2.25*dt*(player.speed>=0?1:-1);
  player.faceX=Math.cos(player.angle);player.faceY=Math.sin(player.angle);
  player.x+=Math.cos(player.angle)*player.speed*dt;
  player.y+=Math.sin(player.angle)*player.speed*dt;
  if(Math.abs(player.speed)>90&&Math.random()<.32){particles.push({x:player.x-Math.cos(player.angle)*55,y:player.y-Math.sin(player.angle)*55,vx:(Math.random()-.5)*45,vy:(Math.random()-.5)*45,life:.4,max:.4,color:"#b9a47a",size:5+Math.random()*6});}
 }else{
  const len=Math.hypot(ix,iy)||1;
  if(ix||iy){player.x+=ix/len*205*dt;player.y+=iy/len*205*dt;player.faceX=ix/len;player.faceY=iy/len;}
 }
 player.x=Math.max(55,Math.min(world.w-55,player.x));player.y=Math.max(75,Math.min(world.h-75,player.y));
 // Camera follows the survivor in the actual screen aspect ratio. No stretching or fake zoom.
 const targetX=Math.max(0,Math.min(world.w-VW,player.x-VW/2));
 const targetY=Math.max(0,Math.min(world.h-VH,player.y-VH/2));
 const smooth=1-Math.pow(.00015,dt);camera.x+=(targetX-camera.x)*smooth;camera.y+=(targetY-camera.y)*smooth;
 // Hostile bugs pursue when close enough.
 bugs.forEach(b=>{
  if(b.hp<=0)return;
  const dx=player.x-b.x,dy=player.y-b.y,d=Math.hypot(dx,dy)||1;
  if(d<390&&d>40){b.x+=dx/d*48*dt;b.y+=dy/d*48*dt;}
  if(d<42&&player.invuln<=0){player.hp=Math.max(0,player.hp-8);player.invuln=.8;burst(player.x,player.y,"#e36c4a",7);say("BUG ATTACK! GET BACK!");}
 });
 player.invuln=Math.max(0,player.invuln-dt);
 player.attack=Math.max(0,player.attack-dt);
 player.attackCooldown=Math.max(0,player.attackCooldown-dt);
 drawParticles(dt);
 if(toastLeft>0&&(toastLeft-=dt)<=0)toast.style.opacity=0;
 document.getElementById("scrap").textContent=player.scrap;
 document.getElementById("hp").textContent=player.hp;
}
let prev=0;
function frame(t){const dt=Math.min((t-prev)/1000||0,.033);prev=t;update(dt,t);render(t);requestAnimationFrame(frame);}
requestAnimationFrame(frame);

function setDir(d,on){keys[d]=on;document.querySelector('[data-dir="'+d+'"]').classList.toggle("down",on);}
document.querySelectorAll("[data-dir]").forEach(btn=>{
 const d=btn.dataset.dir;
 btn.addEventListener("pointerdown",e=>{e.preventDefault();try{btn.setPointerCapture(e.pointerId);}catch(_){}setDir(d,true);});
 const release=e=>{e.preventDefault();setDir(d,false);};
 btn.addEventListener("pointerup",release);btn.addEventListener("pointercancel",release);
 btn.addEventListener("lostpointercapture",()=>setDir(d,false));
 btn.addEventListener("contextmenu",e=>e.preventDefault());
});
window.addEventListener("pointerup",()=>Object.keys(keys).forEach(k=>setDir(k,false)));
window.addEventListener("blur",()=>Object.keys(keys).forEach(k=>setDir(k,false)));
const keymap={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};
window.addEventListener("keydown",e=>{if(keymap[e.key]){e.preventDefault();setDir(keymap[e.key],true);}});
window.addEventListener("keyup",e=>{if(keymap[e.key])setDir(keymap[e.key],false);});
document.getElementById("interact").addEventListener("click",()=>{
 const j=junk.find(j=>!j.got&&Math.hypot(j.x-player.x,j.y-player.y)<85);
 if(j){j.got=true;player.scrap+=j.kind===0?2:1;burst(j.x,j.y,"#f3d078",9);say(player.scrap>=5?"BEACON PARTS FOUND! QUEST COMPLETE!":"SCRAP COLLECTED • "+player.scrap+" / 5");}
 else say("GET CLOSER TO THE SCRAP");
});
document.getElementById("attack").addEventListener("click",()=>{
 if(player.attackCooldown>0)return;
 player.attack=.32;player.attackCooldown=.42;
 const b=bugs.find(b=>b.hp>0&&Math.hypot(b.x-player.x,b.y-player.y)<115);
 if(b){b.hp--;burst(b.x,b.y,"#e5bd68",12);say(b.hp?"BUG HIT!":"BUG SQUASHED!");}
 else say("SWING! NO BUG IN RANGE");
});
document.getElementById("ram").addEventListener("click",()=>{
 if(!player.car){player.car=true;player.speed=0;player.angle=Math.atan2(player.faceY,player.faceX);say("JUNK RIG ENGAGED • UP TO ACCELERATE!");}
 else{player.speed=Math.min(520,player.speed+190);say("RAM BOOST!");}
});
document.getElementById("car").addEventListener("click",()=>{
 if(player.car){player.car=false;player.speed=0;say("BACK ON FOOT");}
 else if(Math.hypot(player.x-550,player.y-1110)<145){player.x=550;player.y=1110;player.car=true;player.angle=-.12;say("TRUCK STARTED • UP TO DRIVE!");}
 else say("FIND THE RUSTY TRUCK BY THE TRACK");
});
})();
</script>
</body></html>
