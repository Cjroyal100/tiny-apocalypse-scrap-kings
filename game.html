<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Apocalypse: Scrap Kings</title>
<style>
:root{--ink:#17221d;--lime:#c9f36b;--rust:#e47742;--cream:#f4e7c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a18;color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}
#shell{height:100dvh;min-height:620px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#30463b,#101a18 65%)}
#top{display:flex;justify-content:space-between;align-items:center;padding:9px 12px 5px;gap:8px}
.brand{font-weight:1000;letter-spacing:1px;font-size:clamp(14px,3.5vw,21px);color:var(--lime);text-shadow:2px 2px #000}
.stats{font-size:12px;text-align:right;line-height:1.45;color:#f8edcf}
#stage{position:relative;flex:1;min-height:300px;margin:4px 8px;border:3px solid #63745b;border-radius:13px;overflow:hidden;box-shadow:0 8px 30px #0009;background:#293b30}
canvas{display:block;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px 12px;border-radius:9px;background:#111d;color:#fff4d5;font-weight:800;font-size:12px;white-space:nowrap;pointer-events:none;border:1px solid #ffffff30}
#bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 12px max(12px,env(safe-area-inset-bottom));background:#111b19}
.panel{display:flex;align-items:center;justify-content:center;gap:8px}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:5px}
.ctrl{border:2px solid #87956b;border-radius:12px;background:linear-gradient(#526449,#2e3d32);color:#fff6d9;font-size:22px;font-weight:1000;box-shadow:0 4px 0 #17231c;touch-action:none;min-width:48px;min-height:44px}
.ctrl:active,.ctrl.down{transform:translateY(3px);box-shadow:0 1px 0 #17231c;background:#82984e}
#dpad .blank{visibility:hidden}
.actions{display:grid;grid-template-columns:repeat(2,minmax(66px,1fr));gap:7px;width:100%;max-width:230px}
.action{font-size:12px;letter-spacing:.3px;min-height:48px;background:linear-gradient(#b76c3e,#77412c);border-color:#e9a36c}
.action.green{background:linear-gradient(#91ae4c,#4d672e);border-color:#c9f36b}
.hint{text-align:center;font-size:10px;color:#b6c4a3;padding:0 8px 5px}
@media(min-width:700px){#stage{max-width:1000px;width:calc(100% - 20px);margin:4px auto}#bottom{max-width:1000px;width:100%;margin:auto}#dpad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,54px)}.ctrl{font-size:25px}}
</style>
</head>
<body>
<div id="shell">
 <div id="top">
  <div class="brand">⚙ TINY APOCALYPSE <span style="color:#e47742">/ SCRAP KINGS</span></div>
  <div class="stats"><div>SCRAP <b id="scrap">0</b>　HP <b id="hp">100</b></div><div>ZONE: BACKYARD</div></div>
 </div>
 <div id="stage"><canvas id="game"></canvas><div id="toast">SCAVENGE THE YARD • FIND 5 SCRAP</div></div>
 <div id="bottom">
  <div class="panel">
   <div id="dpad">
    <div class="blank"></div><button class="ctrl" data-dir="up">▲</button><div class="blank"></div>
    <button class="ctrl" data-dir="left">◀</button><button class="ctrl" data-dir="down">▼</button><button class="ctrl" data-dir="right">▶</button>
   </div>
  </div>
  <div class="panel"><div class="actions">
    <button class="ctrl action green" id="attack">⚔ ATTACK</button>
    <button class="ctrl action" id="ram">🚙 RAM</button>
    <button class="ctrl action" id="interact">✋ PICK UP</button>
    <button class="ctrl action" id="car">🚗 ENTER CAR</button>
  </div></div>
 </div>
 <div class="hint">HOLD arrows to move • TAP PICK UP near scrap • ATTACK to fight bugs</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const stage=document.getElementById('stage');
let W=900,H=560,scale=1;
function resize(){const r=stage.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(260,r.height);canvas.width=Math.floor(W*d);canvas.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0);scale=W/900;}
new ResizeObserver(resize).observe(stage);resize();
const world={w:1800,h:1200};
const p={x:420,y:420,r:17,hp:100,scrap:0,car:false,face:{x:1,y:0},attack:0};
const keys={up:false,down:false,left:false,right:false};
const junk=[ [250,260],[620,250],[820,500],[350,740],[1050,320],[1300,760],[1500,420],[900,950],[550,1000],[1600,1000] ].map(([x,y],i)=>({x,y,t:i%3,got:false}));
const bugs=[{x:700,y:650,hp:2},{x:1250,y:500,hp:2},{x:1450,y:900,hp:2}];
let cam={x:0,y:0},toastTimer=0,toast=document.getElementById('toast');
function say(s){toast.textContent=s;toast.style.opacity=1;toastTimer=2.4;}
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){
 const sx=W/900,sy=H/560;ctx.setTransform(sx,0,0,sy,0,0);
 ctx.clearRect(0,0,900,560);
 // painterly yard base
 ctx.fillStyle='#536344';ctx.fillRect(0,0,900,560);
 for(let y=0;y<600;y+=48)for(let x=0;x<940;x+=48){ctx.fillStyle=((x/48+y/48)%2)?'#5c6c49':'#62724d';ctx.fillRect(x,y,46,46);ctx.fillStyle='#82906455';ctx.fillRect(x+5,y+8,2,2);}
 ctx.save();ctx.translate(-cam.x,-cam.y);
 // cracked concrete path
 ctx.fillStyle='#817b65';ctx.fillRect(0,470,1800,110);
 ctx.strokeStyle='#b5a98a';ctx.lineWidth=3;for(let x=50;x<1800;x+=190){ctx.beginPath();ctx.moveTo(x,475);ctx.lineTo(x+28,505);ctx.lineTo(x+8,545);ctx.stroke();}
 // junkyard fence
 ctx.fillStyle='#333b32';ctx.fillRect(0,0,1800,22);ctx.fillRect(0,1175,1800,25);
 for(let x=0;x<1800;x+=45){ctx.fillStyle='#a6a17d';ctx.fillRect(x,0,5,22);ctx.fillRect(x,1175,5,25);}
 // giant objects
 rounded(80,70,260,125,12,'#8a4d35');rounded(90,80,240,105,8,'#b56a43');ctx.fillStyle='#3d332b';ctx.fillRect(115,102,190,55);
 rounded(500,60,230,145,18,'#465b58');rounded(515,75,200,115,12,'#71877a');ctx.fillStyle='#d6c28a';ctx.font='bold 20px system-ui';ctx.fillText('OLD COOLER',540,140);
 rounded(1080,90,360,180,18,'#5d5546');ctx.fillStyle='#8d8066';ctx.fillRect(1100,115,320,130);ctx.fillStyle='#282e29';ctx.fillRect(1120,135,280,90);
 // small weeds
 for(let i=0;i<90;i++){let x=(i*197)%1780,y=(i*113)%1140;ctx.strokeStyle='#8da15e';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y-10);ctx.moveTo(x,y);ctx.lineTo(x+7,y-13);ctx.stroke();}
 // scrap pieces
 junk.forEach(j=>{if(j.got)return;ctx.save();ctx.translate(j.x,j.y);ctx.rotate(.25);rounded(-13,-9,26,18,4,j.t===0?'#d68a49':j.t===1?'#9da7a0':'#d0b45c');ctx.fillStyle='#34433b';ctx.fillRect(-7,-4,14,8);ctx.restore();});
 // bugs
 bugs.forEach(b=>{if(b.hp<=0)return;ctx.fillStyle='#1c2520';ctx.beginPath();ctx.ellipse(b.x,b.y,20,15,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d8db70';ctx.beginPath();ctx.arc(b.x+8,b.y-4,4,0,7);ctx.arc(b.x-5,b.y-4,4,0,7);ctx.fill();ctx.strokeStyle='#20271e';ctx.lineWidth=4;for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(b.x+k*7,b.y+7);ctx.lineTo(b.x+k*14,b.y+20);ctx.stroke();}});
 // player shadow and body
 ctx.fillStyle='#20291e88';ctx.beginPath();ctx.ellipse(p.x,p.y+12,21,9,0,0,7);ctx.fill();
 ctx.fillStyle=p.car?'#b76a3c':'#e8c58a';ctx.beginPath();ctx.arc(p.x,p.y,17,0,7);ctx.fill();
 ctx.fillStyle='#314a3a';ctx.beginPath();ctx.arc(p.x,p.y-3,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(p.x-13,p.y-2,26,8);
 ctx.fillStyle='#17221d';ctx.fillRect(p.x+4,p.y-3,4,4);
 if(p.attack>0){ctx.strokeStyle='#f4e16c';ctx.lineWidth=7;ctx.beginPath();ctx.arc(p.x+p.face.x*19,p.y+p.face.y*19,25,-1.3,1.3);ctx.stroke();}
 // vehicle parked
 ctx.save();ctx.translate(390,900);rounded(-52,-28,104,56,14,'#9c4e31');rounded(-34,-21,48,42,8,'#c28b55');ctx.fillStyle='#202a25';ctx.fillRect(5,-18,30,36);ctx.fillStyle='#1b211e';ctx.fillRect(-36,-34,22,12);ctx.fillRect(24,-34,22,12);ctx.fillRect(-36,22,22,12);ctx.fillRect(24,22,22,12);ctx.restore();
 ctx.restore();
 // compass-ish objective
 rounded(14,14,200,42,10,'#17231ddd');ctx.fillStyle='#d4f17a';ctx.font='bold 15px system-ui';ctx.fillText('✦ SCRAP: '+p.scrap+'/5',28,41);
 ctx.fillStyle='#f5e8c8';ctx.font='12px system-ui';ctx.fillText('Find the shiny bits',690,30);
 ctx.setTransform(1,0,0,1,0,0);
}
let last=0;
function loop(t){let dt=Math.min((t-last)/1000||0,.04);last=t;
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dy)||1;
 if(dx||dy){p.x+=dx/len*(p.car?250:175)*dt;p.y+=dy/len*(p.car?250:175)*dt;p.face={x:dx/len,y:dy/len};}
 p.x=Math.max(25,Math.min(world.w-25,p.x));p.y=Math.max(35,Math.min(world.h-35,p.y));
 cam.x=Math.max(0,Math.min(world.w-900,p.x-450));cam.y=Math.max(0,Math.min(world.h-560,p.y-280));
 if(p.attack>0)p.attack-=dt;
 if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)toast.style.opacity=0;}
 document.getElementById('scrap').textContent=p.scrap;document.getElementById('hp').textContent=p.hp;
 draw();requestAnimationFrame(loop);
}requestAnimationFrame(loop);
function setDir(dir,on){keys[dir]=on;document.querySelector('[data-dir="'+dir+'"]').classList.toggle('down',on);}
document.querySelectorAll('[data-dir]').forEach(btn=>{
 const d=btn.dataset.dir;
 btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture?.(e.pointerId);setDir(d,true);});
 const stop=e=>{e.preventDefault();setDir(d,false);};
 btn.addEventListener('pointerup',stop);btn.addEventListener('pointercancel',stop);btn.addEventListener('lostpointercapture',()=>setDir(d,false));
 btn.addEventListener('contextmenu',e=>e.preventDefault());
});
window.addEventListener('pointerup',()=>Object.keys(keys).forEach(k=>setDir(k,false)));
window.addEventListener('keydown',e=>{let map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key],true);}});
window.addEventListener('keyup',e=>{let map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])setDir(map[e.key],false);});
document.getElementById('interact').addEventListener('click',()=>{let j=junk.find(j=>!j.got&&Math.hypot(j.x-p.x,j.y-p.y)<65);if(j){j.got=true;p.scrap++;say('+'+(j.t===0?'2':'1')+' SCRAP — NICE FIND!');}else say('GET CLOSER TO THE SCRAP');});
document.getElementById('attack').addEventListener('click',()=>{p.attack=.22;let b=bugs.find(b=>b.hp>0&&Math.hypot(b.x-p.x,b.y-p.y)<85);if(b){b.hp--;say(b.hp?'BUG HIT!':'BUG SQUASHED!');}else say('SWING! NO BUG IN RANGE');});
document.getElementById('ram').addEventListener('click',()=>{p.car=true;say('JUNK RIG ENGAGED — MOVE!');});
document.getElementById('car').addEventListener('click',()=>{p.car=!p.car;say(p.car?'JUNK RIG ENGAGED':'ON FOOT');});
})();
</script>
</body></html>
